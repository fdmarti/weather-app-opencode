name: Publicar release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  version:
    name: Comprobar versión
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.package.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - id: package
        name: Leer versión de package.json
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ -z "$VERSION" || "$VERSION" == "undefined" ]]; then
            echo "package.json debe definir una versión válida." >&2
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - id: release
        name: Comprobar si el release ya existe
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Compilar (${{ matrix.platform }})
    needs: version
    if: needs.version.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-latest
            extension: .exe
            asset: weather-windows.exe
          - platform: Linux
            runner: ubuntu-latest
            extension: ''
            asset: weather-linux
          - platform: macOS
            runner: macos-latest
            extension: ''
            asset: weather-macos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Generar binario
        run: bun run build

      - name: Preparar adjunto del release
        shell: bash
        run: mv "weather${{ matrix.extension }}" "${{ matrix.asset }}"

      - name: Guardar binario
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Crear release
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar binarios
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Crear tag y release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release create "$TAG" release-assets/* --target "$GITHUB_SHA" --title "$TAG" --generate-notes
